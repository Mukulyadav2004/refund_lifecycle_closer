[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-lifecycle-closer"
version = "0.1.0"
description = "Refund lifecycle reconciliation agent for the Razorpay AI Buildathon"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
rlc = "rlc.cli:main"
rlc-server = "rlc.server:serve"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
